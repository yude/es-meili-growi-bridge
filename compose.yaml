# 開発用: es-meili-growi-bridge + Meilisearch
services:
  meilisearch:
    image: getmeili/meilisearch:v1.12
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: "${MEILISEARCH_API_KEY:-master-key}"
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  bridge:
    build:
      context: .
      dockerfile: deploy/compose/Dockerfile
    image: ${BRIDGE_IMAGE:-ghcr.io/your-org/es-meili-growi-bridge:latest}
    ports:
      - "9200:9200"
    environment:
      MEILISEARCH_URL: "http://meilisearch:7700"
      MEILISEARCH_API_KEY: "${MEILISEARCH_API_KEY:-master-key}"
      LISTEN_ADDR: ":9200"
      LOG_LEVEL: "${LOG_LEVEL:-debug}"
    depends_on:
      meilisearch:
        condition: service_healthy

volumes:
  meilisearch_data:
