# GROWI + es-meili-growi-bridge + Meilisearch フルスタック構成
# 使い方: docker compose -f compose.yaml -f compose.growi.yaml up
services:
  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db

  growi:
    image: growi/growi:latest
    ports:
      - "3000:3000"
    environment:
      MONGO_URI: "mongodb://mongo:27017/growi"
      ELASTICSEARCH_URI: "http://bridge:9200/growi"
      ELASTICSEARCH_VERSION: "9"
    depends_on:
      bridge:
        condition: service_started
      mongo:
        condition: service_started

volumes:
  mongo_data:
